# =============================================================================
# Cart Sanitizer Configuration
# =============================================================================

# PriceSanitizer
sanitizer.price.max-discount-percent=50.0
sanitizer.price.min-price=0.01

# InventorySanitizer
sanitizer.inventory.auto-adjust-quantity=true
sanitizer.inventory.backorder-enabled=false
sanitizer.inventory.max-backorder-quantity=5

# QuantityLimitSanitizer
sanitizer.quantity-limit.max-per-item=10
sanitizer.quantity-limit.min-per-item=1
sanitizer.quantity-limit.max-cart-size=50

# CouponSanitizer
sanitizer.coupon.max-per-cart=3
sanitizer.coupon.stacking-enabled=false
