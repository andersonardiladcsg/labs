name: Standalone Validation Test

# This is a standalone workflow that demonstrates the validation pattern
# without requiring a separate reusable workflow file.
#
# Copy this entire file to any repository's .github/workflows/ directory to test.
#
# Test scenarios:
#   1. Create a PR, merge it -> workflow should run and proceed
#   2. Create a PR, close without merge -> workflow should fail at validation
#   3. Manually trigger via Actions tab -> workflow should run and proceed

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
    types: [closed]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # VALIDATE: Inline validation that checks the trigger type
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Trigger
        run: |
          echo "=========================================="
          echo "Validating Deployment Trigger"
          echo "=========================================="
          echo ""
          echo "Event: ${{ github.event_name }}"
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Result: PASS"
            echo "Manual trigger detected. Proceeding with workflow."
            exit 0
          elif [[ "${{ github.event.pull_request.merged }}" == "true" ]]; then
            echo "PR Number: ${{ github.event.pull_request.number }}"
            echo "PR Merged: true"
            echo "Result: PASS"
            echo "Pull request was merged. Proceeding with workflow."
            exit 0
          else
            echo "PR Number: ${{ github.event.pull_request.number }}"
            echo "PR Merged: false"
            echo "Result: FAIL"
            echo "Pull request was closed without merge. Skipping workflow."
            exit 1
          fi

  # DEMO JOB: This demonstrates what happens after validation passes
  demo-job:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display Information
        run: |
          echo "=========================================="
          echo "Demo Job Started"
          echo "=========================================="
          echo ""
          echo "This job only runs when validation passes:"
          echo "  ✓ Manual triggers (workflow_dispatch)"
          echo "  ✓ Merged pull requests"
          echo ""
          echo "Current trigger: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo ""

      - name: Simulate Build
        run: |
          echo "Simulating build process..."
          sleep 2
          echo "Build completed successfully!"

      - name: Simulate Tests
        run: |
          echo "Running tests..."
          sleep 1
          echo "All tests passed!"

      - name: Simulate Deploy
        run: |
          echo "Deploying application..."
          sleep 1
          echo "Deployment completed successfully!"
          echo ""
          echo "=========================================="
          echo "Workflow Completed"
          echo "=========================================="

