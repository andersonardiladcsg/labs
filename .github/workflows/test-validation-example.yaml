name: Test Validation Example

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
    types: [closed]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # VALIDATE: Ensure workflow is triggered by either a manual dispatch or a merged PR
  validate:
    uses: ./.github/workflows/validate-deployment-trigger.yaml

  # EXAMPLE JOB: This only runs if validation passes
  example-job:
    needs: [validate]
    if: ${{ needs.validate.outputs.should_proceed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Echo Success Message
        run: |
          echo "Validation passed successfully!"
          echo "This job only runs for:"
          echo "  1. Manual triggers (workflow_dispatch)"
          echo "  2. Merged pull requests"
          echo ""
          echo "Trigger: ${{ github.event_name }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PR Number: ${{ github.event.pull_request.number }}"
            echo "PR Merged: ${{ github.event.pull_request.merged }}"
          fi
          
          # Add to GitHub Step Summary
          echo "## 🎉 Example Job Executed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Validation Status:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger Type:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "**Initiated By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 What This Demonstrates" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Workflow validation passed" >> $GITHUB_STEP_SUMMARY
          echo "- 🚀 Deployment-ready trigger detected" >> $GITHUB_STEP_SUMMARY
          echo "- 📝 Step summary with markdown formatting" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_This summary appears in the GitHub Actions workflow run UI_" >> $GITHUB_STEP_SUMMARY

      - name: Simulate Work
        run: |
          echo "Performing some work..."
          sleep 2
          echo "Work completed!"

  # ANOTHER EXAMPLE JOB: Also depends on validation
  another-example-job:
    needs: [validate]
    if: ${{ needs.validate.outputs.should_proceed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Another Task
        run: |
          echo "This is another job that only runs after validation passes"
          echo "You can have multiple jobs that all depend on the validate job"
          
          # Add to GitHub Step Summary
          echo "## 🔧 Additional Job Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Job Status:** ✅ Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "**Dependencies:** Validated deployment trigger" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Multiple Jobs Example" >> $GITHUB_STEP_SUMMARY
          echo "This demonstrates how multiple jobs can:" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 Depend on the same validation step" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Contribute to the same step summary" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Run in parallel after validation passes" >> $GITHUB_STEP_SUMMARY

